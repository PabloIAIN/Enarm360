spring.application.name=Enarm360

# ==========================================================
# DATABASE CONFIGURATION
# ==========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enarm360}
spring.datasource.username=${DB_USERNAME:enarmdev}
spring.datasource.password=${DB_PASSWORD:montemorelos2025}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# JWT CONFIGURATION
# ==========================================================
app.jwt.secret=${JWT_SECRET:QUK25thWnwg9VwIKJUZrJRBr67csZsedNEnSZqjwFHQ=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================================
# CORS CONFIGURATION
# ==========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ==========================================================
# FILE UPLOAD CONFIGURATION
# ==========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Uploads
app.uploads.dir=${UPLOADS_DIR:/opt/enarm360/uploads}
app.uploads.public-base=${UPLOADS_PUBLIC_BASE:/files/}

# Resources
spring.web.resources.static-locations=classpath:/static/,file:${UPLOADS_DIR:/opt/enarm360/uploads}/

# ==========================================================
# SERVER CONFIGURATION
# ==========================================================
server.port=${SERVER_PORT:8080}

# ==========================================================
# SCHEDULED TASKS CONFIGURATION
# ==========================================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=subscription-scheduler-

# ==========================================================
# SUBSCRIPTION CONFIGURATION
# ==========================================================
app.subscription.timezone=America/Monterrey
app.subscription.default-currency=USD
app.subscription.metrics-enabled=true
app.subscription.auto-expire-enabled=true
app.subscription.auto-expire-cron=0 0 1 * * ?
app.subscription.metrics-cron=0 0 2 * * ?

# Notificaciones de suscripciones
app.subscription.notifications-enabled=true
app.subscription.expire-warning-days=7
app.subscription.renewal-reminder-days=3

# Límites de intentos por tipo de usuario
app.subscription.max-attempts.free=10
app.subscription.max-attempts.trial=50
app.subscription.max-attempts.standard=-1
app.subscription.max-attempts.premium=-1

# Precios por defecto
app.subscription.default-prices.standard-monthly-price=29.99
app.subscription.default-prices.standard-yearly-price=299.99
app.subscription.default-prices.premium-monthly-price=49.99
app.subscription.default-prices.premium-yearly-price=499.99

# ==========================================================
# COUPON CONFIGURATION
# ==========================================================
app.subscription.coupon-settings.enabled=true
app.subscription.coupon-settings.default-validity-days=30
app.subscription.coupon-settings.max-usage-limit=1000
app.subscription.coupon-settings.max-discount-percentage=50

# ==========================================================
# PAYMENT CONFIGURATION
# ==========================================================
app.subscription.payment-settings.enabled=true
app.subscription.payment-settings.default-payment-method=STRIPE
app.subscription.payment-settings.accepted-currencies=USD,MXN,EUR

# ==========================================================
# LOGGING CONFIGURATION
# ==========================================================
logging.level.root=WARN
logging.level.com.example.enarm360=DEBUG
logging.file.name=logs/app.log

# ==========================================================
# APPLICATION INFO
# ==========================================================
app.name=${APP_NAME:ENARM360}
app.url=${APP_URL:https://enarm360.com}
app.mail.from=${APP_MAIL_FROM:no-reply@enarm360.com}

# ==========================================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:enarmdev360@gmail.com}
spring.mail.password=${MAIL_PASSWORD:goyiritawadlfddf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# ==========================================================
# SMS CONFIGURATION (Twilio)
# ==========================================================
app.sms.provider=${SMS_PROVIDER:twilio}
app.sms.twilio.accountSid=${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxx}
app.sms.twilio.authToken=${TWILIO_AUTH_TOKEN:your_auth_token}
app.sms.twilio.fromNumber=${TWILIO_FROM_NUMBER:+1234567890}

# Configuración adicional de SMS
app.sms.timeout.seconds=30
app.sms.max.retry.attempts=3
